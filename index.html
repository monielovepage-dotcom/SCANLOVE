<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>ใบสมัครเป็นแฟน</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f5f2;--card:#fff;--ink:#14131a;--mut:#8a8794;--acc:#ff4f79;--line:rgba(20,19,26,.14);--stage:#e9e7e2;--u:1vw;--h:1dvh;--m:1vmin;--M:1vmax}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15141a;--card:#201f28;--ink:#f4f2ee;--mut:#9a97a6;--line:rgba(255,255,255,.16);--stage:#0b0a0f}}
:root[data-theme="dark"]{--bg:#15141a;--card:#201f28;--ink:#f4f2ee;--mut:#9a97a6;--line:rgba(255,255,255,.16);--stage:#0b0a0f}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{height:100%;overflow:hidden;background:var(--bg);font-family:'Prompt','Noto Sans Thai',sans-serif;color:var(--ink);overscroll-behavior:none;touch-action:manipulation}
#app{position:relative;width:100%;height:100%;overflow:hidden;background:var(--bg)}
.scene{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .8s;overflow:hidden}
.scene.on{opacity:1;pointer-events:auto}
.abs{position:absolute;left:50%;transform:translateX(-50%)}
.ch{animation:br 3.2s ease-in-out infinite;transform-origin:50% 100%;color:var(--ink)}
.ch svg,.ch img{width:100%;height:auto;display:block;overflow:visible}
.eye{transform-box:fill-box;transform-origin:center;animation:bl 4.2s infinite}
@keyframes bl{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes br{0%,100%{transform:scale(1)}50%{transform:scale(1.03,.97)}}
@keyframes spin{to{transform:rotate(360deg)}}
/* s1 */
#t1{position:absolute;top:8%;width:100%;text-align:center;font-size:clamp(26px,calc(7.6*var(--u)),56px);font-weight:600;letter-spacing:-.01em}
#c1{top:20%;width:calc(30*var(--u));}
#c1.hop,#c6.hop{animation:hop .5s}
@keyframes hop{40%{transform:translateX(-50%) translateY(-18px) scale(1.06)}}
#chev{top:40%;width:26px;color:var(--mut);animation:bob 1.3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,10px)}}
#zw{position:absolute;left:50%;top:50%;transform:translateX(-50%);width:min(calc(60*var(--u)),calc(30*var(--h)));aspect-ratio:1}
#zone{position:absolute;inset:0;border-radius:50%;touch-action:none;cursor:pointer;overflow:hidden;background:var(--card);border:1px solid var(--line);transition:box-shadow .3s}
#zone.press{box-shadow:0 0 0 10px rgba(255,79,121,.12),0 0 50px rgba(255,79,121,.4)}
#zone.ok{box-shadow:0 0 0 14px rgba(255,79,121,.2),0 0 80px rgba(255,79,121,.7)}
.rs{position:absolute;inset:-7%;width:114%;height:114%;pointer-events:none}
#dots{transform-origin:50% 50%;animation:spin 30s linear infinite}
#fp0{position:absolute;inset:20%;opacity:.25;color:var(--ink);transition:opacity .3s,color .3s;pointer-events:none}
#zone.press #fp0{opacity:1;color:var(--acc)}
#scan{position:absolute;left:6%;right:6%;top:0;height:2px;background:var(--acc);box-shadow:0 0 14px 3px var(--acc);opacity:0;pointer-events:none}
#zone.press #scan{opacity:1}
#tfp{position:absolute;width:44%;aspect-ratio:1;margin:-22% 0 0 -22%;pointer-events:none;opacity:0;color:var(--acc);transition:opacity .2s}
#zone.press #tfp{opacity:.9}
.rip{position:absolute;width:20px;height:20px;margin:-10px;border:2px solid var(--acc);border-radius:50%;pointer-events:none;animation:rip .8s ease-out forwards}
@keyframes rip{to{transform:scale(9);opacity:0}}
#hint{position:absolute;left:0;right:0;bottom:9%;text-align:center;color:var(--mut);font-size:16px}
/* fx */
#fx{position:absolute;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.sp{position:absolute;font-size:18px;animation:sp .9s ease-out forwards}
@keyframes sp{from{transform:scale(.4);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(1.3) rotate(90deg);opacity:0}}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:55;transition:opacity .5s}
/* s2 form */
.card{position:absolute;inset:3% 5%;background:var(--card);border:1px solid var(--line);border-radius:28px;box-shadow:0 24px 60px rgba(0,0,0,.08);padding:3.2% 6%;display:flex;flex-direction:column;gap:calc(1.8*var(--h))}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hd h2{font-size:clamp(22px,calc(6.6*var(--u)),43px);font-weight:600;line-height:1.2}
.ver{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--acc);border:1px solid var(--acc);border-radius:99px;padding:3px 9px 3px 4px;white-space:nowrap}
.ver span{width:18px;height:18px;display:block}
#nm{width:100%;background:transparent;border:0;border-bottom:1.5px solid var(--line);font:500 20px 'Prompt',sans-serif;color:var(--ink);padding:8px 0;outline:0;-webkit-user-select:text;user-select:text}
#nm:focus{border-color:var(--acc)}
.lb{font-size:13px;color:var(--mut)}
#chips{display:flex;flex-direction:column;gap:8px}
.chip{border:1.5px solid var(--line);border-radius:99px;padding:7px 14px;font-size:15px;cursor:pointer;transition:all .2s}
.chip.sel{background:var(--ink);color:var(--bg);border-color:var(--ink);transform:scale(1.04)}
#sgw{position:relative;flex:1;min-height:90px;border:1.5px dashed var(--line);border-radius:20px;overflow:hidden}
#sg{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
#sgp{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:15px;pointer-events:none;transition:opacity .3s}
#clr{position:absolute;right:12px;top:8px;font-size:13px;color:var(--mut);cursor:pointer;z-index:2}
#sub{height:52px;border:0;border-radius:99px;background:var(--acc);color:#fff;font:500 18px 'Prompt',sans-serif;transition:opacity .3s,transform .2s}
#sub.rdy{opacity:1;pointer-events:auto}
#sub:active{transform:scale(.97)}
/* s3 */
#tx3{position:absolute;top:6%;width:100%;text-align:center;padding:0 calc(6*var(--u))}
#tx3 h2{font-size:clamp(26px,calc(7.4*var(--u)),53px);font-weight:600}
#tx3 p{color:var(--mut);margin-top:4px;font-size:16px}
#ap{position:absolute;left:50%;top:21%;width:calc(72*var(--u));margin-left:calc(-36*var(--u));background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:0 24px 60px rgba(0,0,0,.1);padding:20px;text-align:center;transform:translateX(110vw) rotate(9deg);transition:transform .55s cubic-bezier(.2,1.25,.4,1)}
#ap.in{transform:rotate(-1.5deg)}
#ap h3{font-size:19px;font-weight:600}
#ap .nn{font-size:17px;font-weight:500;margin:6px 0;color:var(--acc);min-height:30px}
#ap img{width:80%;height:56px;object-fit:contain;display:block;margin:0 auto}
#ap .fpb{width:92px;height:92px;margin:10px auto 6px;padding:14px;border:1.5px dashed var(--line);border-radius:50%;color:var(--acc);transition:border-color .3s}
#ap small{color:var(--mut);font-size:13px}
#stamp{position:absolute;right:-8px;bottom:-10px;width:78px;height:78px;border:2.5px solid var(--acc);border-radius:50%;color:var(--acc);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px;background:var(--card);transform:rotate(-14deg) scale(3);opacity:0;transition:all .45s cubic-bezier(.3,1.6,.5,1)}
#stamp.on{transform:rotate(-14deg);opacity:1}
#c3{bottom:-2%;width:calc(44*var(--u));transform:translate(-50%,130%);transition:transform 1s cubic-bezier(.34,1.6,.5,1)}
#c3.in{transform:translate(-50%,0)}
/* portal */
#portal{position:absolute;inset:0;z-index:40;pointer-events:none;opacity:0;transition:opacity 1s}
#portal.on{opacity:1}
#portal i{position:absolute;left:50%;top:50%;width:calc(40*var(--M));height:calc(40*var(--M));margin:calc(-20*var(--M));border-radius:50%;transform:scale(0) rotate(0);transition:transform 2.2s cubic-bezier(.5,0,.3,1)}
#portal i:nth-child(1){background:radial-gradient(circle,#0d0b1e 0 40%,#6d4cff 58%,rgba(160,130,255,.5) 70%,transparent 74%);filter:blur(6px)}
#portal i:nth-child(2){background:conic-gradient(transparent,rgba(255,255,255,.55),transparent 30%,rgba(95,245,224,.5),transparent 60%,rgba(255,150,200,.5),transparent);-webkit-mask:radial-gradient(circle,transparent 52%,#000 56%,#000 70%,transparent 74%);mask:radial-gradient(circle,transparent 52%,#000 56%,#000 70%,transparent 74%);filter:blur(3px);transition-duration:2.4s}
#portal.go i{transform:scale(3.2) rotate(200deg)}
/* s4 lab */
#s4{background:linear-gradient(180deg,#0d0b1e,#2a1163 70%,#41208f);color:#fff}
.rg{position:absolute;left:50%;top:40%;border:1px solid rgba(95,245,224,.35);border-radius:50%;transform:translate(-50%,-50%);animation:pu 4s ease-in-out infinite}
@keyframes pu{50%{opacity:.4;transform:translate(-50%,-50%) scale(1.06)}}
#orb{position:absolute;left:50%;top:40%;width:calc(34*var(--m));height:calc(34*var(--m));margin:calc(-17*var(--m));border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(95,245,224,.35),rgba(124,92,255,.25));border:1px solid rgba(95,245,224,.7);box-shadow:0 0 40px rgba(95,245,224,.4),inset 0 0 30px rgba(95,245,224,.3);display:flex;align-items:center;justify-content:center;color:#5ff5e0;cursor:pointer;touch-action:manipulation;z-index:5;transition:transform .12s}
#orb:active{transform:scale(.94)}
#orb .fi{width:46%;height:46%}
#orbr{position:absolute;left:50%;top:40%;width:calc(42*var(--m));height:calc(42*var(--m));margin:calc(-21*var(--m));pointer-events:none;z-index:5}
#chg{position:absolute;left:0;right:0;top:60%;text-align:center;font-size:17px;color:#cfc8ff;z-index:5}
#chg b{display:block;font-size:30px;color:#5ff5e0;font-weight:600}
#c4{bottom:3%;width:calc(30*var(--u));color:#fff;z-index:5;transform:translate(-50%,130%);transition:transform 1s cubic-bezier(.34,1.6,.5,1)}
#c4.in{transform:translate(-50%,0)}
#c4.hop,#c5.hop{animation:hop2 .4s}
@keyframes hop2{40%{transform:translate(-50%,-16px)}}
#dome{position:absolute;left:50%;top:40%;width:calc(30*var(--m));height:calc(30*var(--m));margin:calc(-15*var(--m));border-radius:50%;border:3px solid #5ff5e0;background:radial-gradient(circle,rgba(255,255,255,.06),rgba(200,170,255,.3) 70%,rgba(255,255,255,.5));box-shadow:0 0 40px 10px rgba(95,245,224,.6),inset 0 0 50px rgba(255,255,255,.5);transform:scale(0);opacity:0;pointer-events:none;transition:transform 2.6s cubic-bezier(.2,.7,.3,1),opacity .6s;z-index:6;animation:mo 2.2s ease-in-out infinite}
@keyframes mo{50%{border-radius:47% 53% 50% 50%}}
#dome.go{transform:scale(11);opacity:1}
#sys{position:absolute;left:0;right:0;top:62%;text-align:center;font-size:clamp(24px,calc(7.4*var(--u)),50px);font-weight:600;opacity:0;transition:opacity .7s;text-shadow:0 0 14px #5ff5e0;z-index:20}
#sys.on{opacity:1}
#glow{position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,#fff,#ffe3f1 45%,#d9ccff);opacity:0;transition:opacity 1.5s;pointer-events:none;z-index:10}
#glow.on{opacity:.9}
#rays{position:absolute;left:50%;top:40%;width:calc(160*var(--M));height:calc(160*var(--M));margin:calc(-80*var(--M));background:repeating-conic-gradient(rgba(255,255,255,.5) 0 6deg,transparent 6deg 18deg);opacity:0;transition:opacity 1.5s;animation:spin 40s linear infinite;pointer-events:none;z-index:11;-webkit-mask:radial-gradient(circle,#000,transparent 55%);mask:radial-gradient(circle,#000,transparent 55%)}
#rays.on{opacity:.7}
#fin{position:absolute;inset:0;z-index:30;pointer-events:none;text-align:center;color:var(--ink)}
#fin>*{position:absolute;left:0;right:0;padding:0 calc(8*var(--u));opacity:0;transform:scale(.8);transition:all .8s cubic-bezier(.34,1.5,.5,1)}
#fin>.on{opacity:1;transform:none}
#f1{top:11%;font-size:clamp(26px,calc(7.6*var(--u)),53px);font-weight:500}
#f2{top:18%;font-size:clamp(30px,calc(8.6*var(--u)),62px);font-weight:600;line-height:1.2;color:#d6246e}
#f3{top:64%;font-size:clamp(17px,calc(5*var(--u)),33px);font-weight:500}
#f4{top:72%;font-size:14px;color:var(--mut)}
#rp{position:absolute;bottom:3%;left:auto;right:6%;transform:none;font-size:14px;color:var(--mut);text-decoration:underline;z-index:40;cursor:pointer;opacity:0;transition:opacity 1s}
.pt{position:absolute;bottom:12%;width:4px;height:4px;border-radius:50%;background:#5ff5e0;box-shadow:0 0 8px #5ff5e0;animation:up 5s linear forwards}
@keyframes up{to{transform:translateY(calc(-70*var(--h)));opacity:0}}
/* s5 keepsake box */
#s5{background:var(--bg)}
#b0{position:absolute;top:12%;width:100%;padding:0 calc(8*var(--u));text-align:center;font-size:clamp(20px,calc(6*var(--u)),40px);font-weight:500;transition:opacity .6s}
#bx{position:absolute;left:50%;top:34%;width:calc(64*var(--u));aspect-ratio:1/.62;transform:translateX(-50%)}
#bx.bob{animation:bobx 3s ease-in-out infinite}
@keyframes bobx{50%{transform:translateX(-50%) translateY(-7px)}}
.bk{position:absolute;inset:0;background:#0f0e14;border-radius:10px}
.bf{position:absolute;left:0;right:0;top:22%;bottom:0;background:#2a2833;border:1px solid rgba(255,255,255,.12);border-radius:6px 6px 12px 12px;z-index:3;box-shadow:0 24px 40px rgba(0,0,0,.2)}
#bcard{position:absolute;left:9%;width:82%;height:88%;top:-160%;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;z-index:2;text-align:center;padding:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:top 1.1s cubic-bezier(.3,1.3,.5,1);box-shadow:0 8px 24px rgba(0,0,0,.25)}
#bcard b{font-size:14px;font-weight:500;color:var(--acc);min-height:20px}
#bcard img{height:44%;max-width:92%;object-fit:contain}
#bfp{width:44px;height:44px}
#bcard.s1{top:-54%}#bcard.s2{top:8%}
#lid{position:absolute;left:-4%;right:-4%;top:-2%;height:26%;background:#34323f;border:1px solid rgba(255,255,255,.14);border-radius:8px;z-index:4;opacity:0;transform:translateY(-260%) rotate(-14deg);transform-origin:0 100%;transition:transform .8s cubic-bezier(.34,1.5,.5,1),opacity .3s;box-shadow:0 6px 14px rgba(0,0,0,.25)}
#lid.on{opacity:1;transform:none}
#rbv,#rbh{position:absolute;background:var(--acc);z-index:5}
#rbv{left:50%;top:-2%;bottom:0;width:13%;margin-left:-6.5%;transform:scaleY(0);transform-origin:top;transition:transform .7s}
#rbh{left:0;right:0;top:38%;height:13%;transform:scaleX(0);transition:transform .7s .15s}
#rbv.on{transform:scaleY(1)}#rbh.on{transform:scaleX(1)}
#seal{position:absolute;left:50%;top:44%;width:30%;min-width:64px;aspect-ratio:1;margin-left:-15%;transform:translateY(-50%) scale(.4);border-radius:50%;background:#fff;color:var(--acc);display:flex;align-items:center;justify-content:center;opacity:0;z-index:6;touch-action:none;cursor:pointer;transition:all .5s cubic-bezier(.34,1.6,.5,1)}
#seal.on{opacity:1;transform:translateY(-50%);animation:pl 1.6s infinite}
#seal.done{animation:none;transform:translateY(-50%) scale(1.12);box-shadow:0 0 30px rgba(255,79,121,.6)}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(255,79,121,.55)}80%,100%{box-shadow:0 0 0 16px rgba(255,79,121,0)}}
#seal .si{width:50%;height:50%;pointer-events:none}
#seal .rr{position:absolute;inset:-8%;width:116%;height:116%;pointer-events:none}
#sh{position:absolute;top:63%;width:100%;padding:0 calc(8*var(--u));text-align:center;color:var(--mut);font-size:16px;opacity:0;transition:opacity .6s}
#c5{bottom:3%;width:calc(34*var(--u));transform:translate(-50%,130%);transition:transform 1s cubic-bezier(.34,1.6,.5,1)}
#c5.in{transform:translate(-50%,0)}
/* s2 accidental application */
#rec{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px}
.rf{width:72px;height:72px;color:var(--acc);animation:br 2s ease-in-out infinite}
#rt{font-size:18px;font-weight:500;line-height:1.35}
#rs{color:var(--mut);font-size:14px}
.term{display:flex;align-items:center;gap:12px;padding:10px 14px;border:1px solid var(--line);border-radius:16px;font-size:15px;cursor:pointer}
.term i{width:22px;height:22px;border-radius:50%;background:var(--acc);color:#fff;font-style:normal;font-size:13px;display:flex;align-items:center;justify-content:center;flex:none}
.term.shake{animation:shk .4s}
@keyframes shk{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
#toast{position:absolute;left:50%;bottom:86px;transform:translate(-50%,10px);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:14px;opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap;z-index:5}
#toast.on{opacity:1;transform:translate(-50%,0)}
/* s6 question */
#s6{background:var(--bg)}
#c6{top:10%;width:calc(44*var(--u));}
#q{position:absolute;top:38%;width:100%;padding:0 calc(8*var(--u));text-align:center;font-size:clamp(28px,calc(8.4*var(--u)),62px);font-weight:600;letter-spacing:-.01em;line-height:1.2}
#qs{position:absolute;top:49%;width:100%;padding:0 calc(8*var(--u));text-align:center;color:var(--mut);font-size:17px}
#btns{position:absolute;left:50%;width:calc(84*var(--u));transform:translateX(-50%);top:60%;display:flex;gap:12px;align-items:center;justify-content:center;transition:opacity .5s}
#btns button{font:600 20px 'Prompt',sans-serif;border-radius:99px;cursor:pointer;transition:all .35s cubic-bezier(.34,1.5,.5,1)}
#yes{flex:1;height:60px;border:0;background:var(--acc);color:#fff;box-shadow:0 10px 30px rgba(255,79,121,.35)}
#no{flex:none;min-width:96px;height:52px;padding:0 20px;background:transparent;color:var(--ink);border:1.5px solid var(--line);overflow:hidden;white-space:nowrap}
/* accident stamp, fake system bits, text balance */
#tx3{transition:opacity .25s}
#afp svg{opacity:0;transform:scale(2.6) rotate(-16deg);transition:all .3s cubic-bezier(.3,1.7,.5,1)}
#afp.in svg{opacity:.95;transform:none}#afp.in{border-color:transparent!important}
#ap.thud{animation:thud .28s}
@keyframes thud{40%{transform:rotate(-1.5deg) translateY(7px) scale(.97)}}
#chk{position:absolute;left:50%;top:59%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;font-size:15px;width:max-content;max-width:90%}
.cr{display:flex;gap:8px;align-items:center;opacity:0;transform:translateY(6px);transition:all .4s;white-space:nowrap}
.cr.on{opacity:1;transform:none}.cr i{font-style:normal;color:var(--acc);width:20px;text-align:center}
#notif{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:0;right:0;margin:0 auto;width:min(calc(94*var(--u)),calc(100% - 24px));z-index:70;background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:0 12px 40px rgba(0,0,0,.18);padding:10px 14px;display:flex;gap:12px;align-items:center;transform:translateY(-170%);transition:transform .5s cubic-bezier(.3,1.4,.5,1);pointer-events:none}
#notif.on{transform:none}
#notif span{width:38px;height:38px;border-radius:10px;background:var(--acc);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
#notif b{display:block;font-size:14px;font-weight:600;white-space:nowrap}#notif small{color:var(--mut);font-size:13px;white-space:nowrap}
#t1,#cg,#q,#sys,#f2,#f1,#ap h3,#hint,#ch,#yes,#no{white-space:nowrap}
#qs,#sc,#b0,#f3,#sh{white-space:pre-line;text-wrap:balance}
@media (prefers-reduced-motion:reduce){.ch,.eye,#dots,.rg{animation:none}}
</style>
</head>
<body>
<div id="app">
 <section class="scene on" id="s1">
  <h1 id="t1"></h1>
  <div class="abs" id="c1"></div>
  <svg id="chev" class="abs" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8l7 7 7-7"/></svg>
  <div id="zw">
   <svg class="rs" viewBox="0 0 120 120"><circle id="dots" cx="60" cy="60" r="57" fill="none" stroke="#ff4f79" stroke-width="1.6" stroke-dasharray="1 5" stroke-linecap="round"/>
    <circle id="prog" cx="60" cy="60" r="54" fill="none" stroke="#ff4f79" stroke-width="3" stroke-linecap="round" stroke-dasharray="339.3" stroke-dashoffset="339.3" transform="rotate(-90 60 60)"/></svg>
   <div id="zone"><div id="fp0"></div><div id="scan"></div><div id="tfp"></div></div>

  await sleep(300); $('#f1').classList.add('on'); await sleep(1000); $('#f2').classList.add('on'); burst(a.width / 2, a.height * .2, 14, ['💗', '✨'], 120);
  $('#c5').classList.add('hop');
  await sleep(1100); $('#f3').classList.add('on'); finalReady = true; await sleep(3400); goQuestion();
}
$('#s5').addEventListener('pointerdown', e => { if (!finalReady || e.target.id === 'rp') return; const a = appR(); burst(e.clientX - a.left, e.clientY - a.top, 7, ['💗', '💖', '✨'], 110); buzz(10); });

// 7) the final question
let noN = 0, answered = false;
function goQuestion() { show('s6'); const a = appR(); burst(a.width / 2, a.height * .2, 8, ['💗', '✨'], 90); }
$('#no').onclick = () => { if (answered) return; noN++; buzz(15);
  const y = $('#yes'), nb = $('#no'); y.style.height = (60 + noN * 12) + 'px'; y.style.fontSize = (20 + noN * 3) + 'px';
  if (noN >= CONFIG.noTexts.length - 1) { nb.style.opacity = 0; nb.style.minWidth = 0; nb.style.width = 0; nb.style.padding = 0; nb.style.borderWidth = 0; nb.style.margin = '-6px'; nb.style.pointerEvents = 'none'; }
  else { nb.textContent = CONFIG.noTexts[noN]; nb.style.transform = `scale(${1 - noN * .08})`; }
  const c = $('#c6'); c.classList.remove('hop'); void c.offsetWidth; c.classList.add('hop'); };
$('#yes').onclick = async e => { if (answered) return; answered = true; buzz([40, 40, 90]); const a = appR();
  $('#btns').style.opacity = 0; $('#btns').style.pointerEvents = 'none'; flash(500);
  burst(e.clientX - a.left, e.clientY - a.top, 26, ['💗', '✨', '💖'], 190); $('#c6').innerHTML = character('hearts');
  $('#q').textContent = CONFIG.yesTitle; $('#qs').textContent = CONFIG.yesMessage; hearts(60, 200);
  await sleep(2500); $('#rp').style.opacity = .8; };
$('#s6').addEventListener('pointerdown', e => { if (!answered || e.target.id === 'rp') return; const a = appR(); burst(e.clientX - a.left, e.clientY - a.top, 7, ['💗', '💖', '✨'], 110); buzz(10); });
</script>
